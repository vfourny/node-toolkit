name: Release

# Every push on main runs release-please (shared release.yml, auto-merged release PR):
# - a feat / fix merge opens or updates the release PR, nothing is published;
# - the merge of the release PR creates the vX.Y.Z tag: `build` then `publish` ship it to npm.
# Manual run (Actions › Release › Run workflow): builds and publishes the version in package.json,
# to recover from a failed publish (the release already exists, so release-please won't redo it).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    uses: vfourny/.github/.github/workflows/release.yml@v4.0.1
    with:
      is_auto_merged: true
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build:
    needs: release
    # !cancelled(): still runs on a manual run, where `release` is skipped
    if: ${{ !cancelled() && (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: vfourny/.github/.github/workflows/build.yml@v4.0.1
    with:
      node_version: '22'

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 ships npm 11, required by trusted publishing
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Only `dist` is published (`files`): no install needed, and no `prepare` (husky)
      - name: Publish
        run: npm publish --ignore-scripts
