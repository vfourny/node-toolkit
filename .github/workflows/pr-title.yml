name: PR title

# Separate from pr.yml so that editing the title or description re-runs this check
# only, without publishing skipped build checks.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id kept as `pr-checks`: the required status check is `pr-checks / pr-title`
  pr-checks:
    uses: vfourny/.github/.github/workflows/pr-checks.yml@v4.0.1
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      node_version: '22'
      # Toolkit maintained solo: most PRs (including Renovate's) have no issue
      is_linked_issue_checked: false
