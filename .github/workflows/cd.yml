name: CD

# Automatic release: release.yml (release-please) opens the release PR and auto-merges it once its
# checks pass; the run triggered by that merge creates the vX.Y.Z tag, then `publish` publishes
# the dist built by `build` in the same run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: vfourny/.github/.github/workflows/build.yml@v4.0.0
    with:
      node_version: '22'

  release:
    needs: build
    uses: vfourny/.github/.github/workflows/release.yml@v4.0.0
    with:
      is_auto_merged: true
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  publish:
    needs: [build, release]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 ships npm 11, required by trusted publishing
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Only `dist` is published (`files`): no install needed, and no `prepare` (husky)
      - name: Publish
        run: npm publish --ignore-scripts
