name: PR

on:
  pull_request:
    branches: [main, next]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Separate group for title/description edits, so they never cancel a build
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: vfourny/.github/.github/workflows/pr-checks.yml@1c50b8eea90e3b146f1fc0e2cb2bb39736dab67f # v2.1.0
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      node_version: '22'
      # Toolkit maintained solo: most PRs (including Renovate's) have no issue
      is_linked_issue_checked: false

  build:
    # Editing the PR title or description only re-runs pr-checks
    if: github.event.action != 'edited'
    uses: vfourny/.github/.github/workflows/build.yml@1c50b8eea90e3b146f1fc0e2cb2bb39736dab67f # v2.1.0
    with:
      node_version: '22'

  package:
    name: Check published package
    # Reuses the dist artifact uploaded by build (skipped along with it on PR edits)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check package
        run: npm run lint:package
